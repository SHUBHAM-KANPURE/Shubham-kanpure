    <!-- apply the saved / system theme before first paint (no flash) -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e6e7ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316" />
    <script>
      try {
        var t = localStorage.getItem('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        document.documentElement.style.colorScheme = t
      } catch (e) { document.documentElement.dataset.theme = 'light' }
    </script>
